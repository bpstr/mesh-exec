name: mesh-exec

services:
  postgres:
    image: postgres:17-bookworm
    environment:
      POSTGRES_USER: mesh
      POSTGRES_PASSWORD: ${MESH_POSTGRES_PASSWORD:-mesh-local-development}
      POSTGRES_DB: mesh
    ports:
      - '127.0.0.1:${MESH_POSTGRES_PORT:-55432}:5432'
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U mesh -d mesh']
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 5s

volumes:
  postgres-data:
